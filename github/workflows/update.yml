name: Update Metro monitor

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch feed
        run: python fetch_feed.py
      - name: Commit updated archive
        run: |
          git config user.name "metro-monitor"
          git config user.email "metro-monitor@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || (git commit -m "Update stories" && git push)
